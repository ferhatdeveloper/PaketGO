version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: paketgo-db
    environment:
      POSTGRES_DB: paketgo
      POSTGRES_USER: paketgo
      POSTGRES_PASSWORD: paketgo
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./seed.sql:/docker-entrypoint-initdb.d/02-seed.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paketgo"]
      interval: 5s
      timeout: 5s
      retries: 5

  postgrest:
    image: postgrest/postgrest:v12.0.2
    container_name: paketgo-api
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGRST_DB_URI: postgres://paketgo:paketgo@db:5432/paketgo
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: web_anon
      PGRST_SERVER_PORT: 3000
      PGRST_JWT_SECRET: super-secret-jwt-token-for-paketgo-app-dev
    ports:
      - "3000:3000"

volumes:
  pgdata:
